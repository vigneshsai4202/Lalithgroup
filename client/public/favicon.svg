<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1F4D3A"/>
  <!-- Rice grain -->
  <ellipse cx="32" cy="30" rx="9" ry="15" fill="#D9A441" transform="rotate(-15 32 30)"/>
  <!-- Stalk -->
  <line x1="32" y1="46" x2="32" y2="54" stroke="#D9A441" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="26" y2="44" stroke="#D9A441" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="38" y2="42" stroke="#D9A441" stroke-width="2" stroke-linecap="round"/>
  <!-- Grain highlights -->
  <circle cx="26" cy="24" r="3" fill="#FAF6EC" opacity="0.4"/>
  <circle cx="38" cy="34" r="2.5" fill="#FAF6EC" opacity="0.3"/>
</svg>
